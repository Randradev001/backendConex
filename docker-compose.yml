version: '3'
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: backend-node:1
    ports:
      - "8065:8065"
    volumes:
      #- C:/Users/Nacho/Desktop/React/00_Backends/0_fotos_servidor:/src/fotosEvidencia
      - /var/www/html/web/hallazgo_seguridad/documentos:/src/fotosEvidencia
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /var/www/backend/backendAprendizaje/reportes:/src/img/reporteAprendizaje
      - /var/www/backend/backendAprendizaje/reporteStatus:/src/img/reporteStatusAprendizaje

    restart: always
